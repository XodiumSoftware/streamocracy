name: Xodium CI/CD - Publish to AUR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

env:
  PACKAGE_NAME: streamocracy
  AUR_REPO: ssh://aur@aur.archlinux.org/streamocracy.git

jobs:
  publish_aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6.0.2

      - id: get_version
        name: Get Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - id: install_dependencies
        name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
        shell: bash

      - id: setup_ssh
        name: Setup SSH for AUR
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          log-public-key: false

      - id: configure_ssh
        name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "Host aur.archlinux.org" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/aur" >> ~/.ssh/config
          echo "  User aur" >> ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
        shell: bash

      - id: prepare_pkgbuild
        name: Prepare PKGBUILD
        run: |
          mkdir -p aur-build
          cd aur-build

          # Update version in PKGBUILD
          sed "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.VERSION }}/" ../pkg/PKGBUILD > PKGBUILD

          # Copy additional files
          cp ../pkg/streamocracy.service .
          cp ../pkg/streamocracy.sysusers .

          # Generate SRCINFO
          makepkg --printsrcinfo > .SRCINFO
        shell: bash

      - id: clone_aur_repo
        name: Clone AUR Repository
        run: |
          git clone "$AUR_REPO" aur-repo || true
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        shell: bash

      - id: update_aur_files
        name: Update AUR Files
        run: |
          cp aur-build/PKGBUILD aur-repo/
          cp aur-build/.SRCINFO aur-repo/
          cp aur-build/streamocracy.service aur-repo/
          cp aur-build/streamocracy.sysusers aur-repo/
        shell: bash

      - id: commit_and_push
        name: Commit and Push to AUR
        run: |
          cd aur-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update to v${{ steps.get_version.outputs.VERSION }}"
          git push origin master
        shell: bash

      - id: cleanup
        name: Cleanup
        if: always()
        run: rm -rf aur-build aur-repo ~/.ssh/aur
        shell: bash
