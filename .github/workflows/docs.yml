name: Xodium CI/CD - Docs

on:
  workflow_run:
    workflows: [ "Xodium CI/CD - Release" ]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6.0.2

      - id: setup_rust
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@d197c158264056996cfba74a9c2d93886346edc3
        with:
          toolchain: stable

      - id: build
        name: Build docs
        run: cargo doc --no-deps

      - id: flatten-docs
        name: Flatten docs to root
        run: |
          cp -r target/doc/streamocracy/* target/doc/
          rm -rf target/doc/streamocracy

      - id: upload-artifact
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
