name: Xodium CI/CD - Docker

on:
  workflow_run:
    workflows: [ "Xodium CI/CD - Release" ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build_and_push:
    name: Build and Push
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6.0.2

      - id: setup_docker_buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: login_ghcr
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        name: Docker Metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/streamocracy
          tags: |
            type=raw,value=nightly
            type=sha,prefix=,suffix=,format=short

      - id: build_and_push
        name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: summary
        name: Summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          for tag in $(echo "${{ steps.docker_meta.outputs.tags }}" | tr '\n' ' '); do
            echo "| $tag | \`$tag\` |" >> $GITHUB_STEP_SUMMARY
          done
        shell: bash
